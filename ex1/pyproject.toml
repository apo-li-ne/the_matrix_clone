[project]
name = "loading"
version = "0.1.0"
description = "Matrix data analysis with pandas, numpy and matplotlib"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0, <3.0.0"]
build-backend = "poetry.core.masonry.api"